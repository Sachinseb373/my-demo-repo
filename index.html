<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <style>
    body {
      background-color: green; /* Rich, readable red background */
      color: #ffffff;            /* Pure white text */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }

    main {
      max-width: 650px;
      padding: 2rem;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 0.75rem;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-block;
      padding: 0.85rem 1.75rem;
      color: #ffffff;
      border: 2px solid #ffffff;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      transition: background-color 0.2s, color 0.2s;
    }

    .btn:hover {
      background-color: #ffffff;
      color: #c8102e;
    }
  </style>
</head>
<body>
  <main>
    <h1>Welcome to Your Website</h1>
    <p>This is a clean front-page template with a bold red background and high-contrast white text.</p>
    <a href="#learn-more" class="btn">Get Started</a>
  </main>
</body>
</html>
